{% extends "base.html" %}
{% block title %}Confirmer la suppression{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg rounded-xl bg-white p-6 shadow-sm">
  <h1 class="mb-2 text-xl font-bold">Confirmer la suppression</h1>
  <p class="mb-6 text-sm text-slate-600">Voulez-vous vraiment supprimer « {{ object }} » ? Cette action est irréversible.</p>
  <form method="post" class="flex justify-end gap-3">
    {% csrf_token %}
    <a href="{{ cancel_url }}" class="rounded-lg border px-4 py-2 text-sm hover:bg-slate-50">Annuler</a>
    <button class="rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-700">Supprimer</button>
  </form>
</div>
{% endblock %}
