{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
  <h2 class="mb-4 text-xl font-semibold text-slate-700 dark:text-navy-50 lg:text-2xl">{{ title }}</h2>
  <form method="post" enctype="multipart/form-data" class="card space-y-4 p-4 sm:p-5">
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <div class="flex justify-end space-x-2 pt-2">
      <a href="{{ cancel_url }}" class="btn border border-slate-300 font-medium text-slate-700 hover:bg-slate-150 focus:bg-slate-150 active:bg-slate-150/80 dark:border-navy-450 dark:text-navy-100 dark:hover:bg-navy-500 dark:focus:bg-navy-500 dark:active:bg-navy-500/90">Annuler</a>
      <button class="btn bg-primary font-medium text-white hover:bg-primary-focus focus:bg-primary-focus active:bg-primary-focus/90 dark:bg-accent dark:hover:bg-accent-focus dark:focus:bg-accent-focus dark:active:bg-accent/90">Enregistrer</button>
    </div>
  </form>
</div>
{% endblock %}
