{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl rounded-xl bg-white p-6 shadow-sm">
  <h1 class="mb-6 text-xl font-bold">{{ title }}</h1>
  <form method="post" enctype="multipart/form-data" class="space-y-4">
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <div class="flex justify-end gap-3 pt-2">
      <a href="{{ cancel_url }}" class="rounded-lg border px-4 py-2 text-sm hover:bg-slate-50">Annuler</a>
      <button class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700">Enregistrer</button>
    </div>
  </form>
</div>
{% endblock %}
